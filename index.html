<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FANZO BARBER</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header class="escena" id="escena">
        <div class="cabecera">
            <h1 class="titulo" id="titulo">
                FANZO BARBER
            </h1>
        </div>

        <div class="botones">
            <button id="btn1">Registrar corte</button>
            <button id="btn2">Turnos</button>
            <button id="btn3">Imprimir</button>
        </div>
    </header>

    <!-- Modal 1: registrar / editar corte -->
    <div class="modal" id="modal">
        <div class="modal-contenido">
            <button type="button" class="cerrar" id="cerrar">&times;</button>
            <h2 id="tituloModal">Reservar Turno</h2>

            <form id="formTurno">
                <label for="fecha">Fecha y hora de corte</label>
                <input type="datetime-local" id="fecha" required>

                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="EJ: Quillan Silva" required>

                <label for="servicio">Servicio requerido</label>
                <select id="servicio" required>
                    <option value="">Selecciona un servicio</option>
                </select>

                <label for="peluquero">Peluquero disponible</label>
                <select id="peluquero" required disabled>
                    <option value="">Primero elegí fecha y hora</option>
                </select>

                <button type="submit" class="enviar" id="btnEnviar">Confirmar turno</button>
                <p id="mensaje"></p>
            </form>
        </div>
    </div>

    <!-- Modal 2: tabla de turnos -->
    <div class="modal" id="modalTurnos">
        <div class="modal-contenido ancho">
            <button type="button" class="cerrar" id="cerrarTurnos">&times;</button>
            <h2>Turnos del día</h2>
            <p class="solo-imprimir" id="fechaImpresion"></p>

            <label for="diaTurnos">Día a consultar</label>
            <input type="date" id="diaTurnos">
            <div class="dias" id="diasConTurnos"></div>

            <div class="tabla-scroll">
                <table id="tablaTurnos">
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Cliente</th>
                            <th>Servicio</th>
                            <th>Peluquero</th>
                            <th>Precio</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTurnos"></tbody>
                </table>
            </div>

            <p id="totalDia"></p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
